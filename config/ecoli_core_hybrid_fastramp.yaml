  n_metabolites: 72
  n_reactions: 71
  max_metabolites_per_reaction: 4
  n_frames: 4000
  delta_t: 0.035
  start_frame: 0
  seed: 42
  log_k_min: -0.5
  log_k_max: 1.0
  log_km_min: -0.5
