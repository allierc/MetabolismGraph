description: "Yeast glycolysis (Smallbone2013 SBML, Michaelis-Menten kinetics, 20 metabolites, 30 reactions)"
dataset: glycolysis_yeast

simulation:
  # SBML import — stoichiometry + stimulus species extracted from SBML
  sbml_file: papers/MODEL1303260010/MODEL1303260010/MODEL1303260010.xml
  sbml_t_end: 420.0  # longer simulation so transient is small fraction

  # Overridden by SBML parser, but must be present for config validation
  n_metabolites: 20
  n_reactions: 30
  max_metabolites_per_reaction: 4
  n_frames: 12000
  delta_t: 0.035
  start_frame: 0
  seed: 42

  # Michaelis-Menten parameters
  log_k_min: -0.5    # Vmax in [0.3, 10]
  log_k_max: 1.0
  log_km_min: -0.5   # Km in [0.3, 3.2] mM
  log_km_max: 0.5

  use_mass_action: false
  flux_limit: true

  # Homeostasis: keeps concentrations bounded, prevents runaway accumulation
  # lambda=1.0 balances responsiveness to stimuli vs stability
  homeostatic_strength: 1.0
  baseline_mode: initial
  baseline_concentration: 1.0
  circadian_amplitude: 0.0
  circadian_period: 1440

graph_model:
  model_name: PDE_MichaelisMenten
  prediction: first_derivative
  output_size_sub: 1
  hidden_dim_sub: 64
  n_layers_sub: 3
  hidden_dim_node: 64
  n_layers_node: 3
  aggr_type: mul
  update_type: none

plotting:
  colormap: tab20

training:
  n_epochs: 1
  n_runs: 1
  device: auto
  batch_size: 8
  seed: 42
  data_augmentation_loop: 2000
  learning_rate_start: 0.001
  learning_rate_k: 0.005
  learning_rate_node: 0.001
  learning_rate_sub: 0.0005
  freeze_stoichiometry: true
  learning_rate_S_start: 0.0
  coeff_S_L1: 0.0
  coeff_S_integer: 0.0
  coeff_mass_conservation: 0.0
  coeff_MLP_sub_diff: 5
  coeff_MLP_node_L1: 1.0
  coeff_MLP_sub_norm: 0.0
  coeff_k_floor: 0.0
  k_floor_threshold: -3.0
  recurrent_training: false
  time_step: 1
